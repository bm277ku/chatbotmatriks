            tex: {

    <style>

            align-items: center;

        .header h1 { font-size:17px; font-weight:600; flex:1; }

        .message.bot { align-self:flex-start; background:#e9edf4; color:#1e2a3a; border-bottom-left-radius:4px; }
        
        .concept-card {
            position: relative;
            background: #ffffff;
            border-radius: 8px;

            margin-top: 6px;

            top: 10px;

            background: #2b5a8a;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;

        .message .latex-block { margin:4px 0; overflow-x:auto; padding:2px 0; }
        .message .latex-block svg { max-width:100%; height:auto; }
        .message .error { color:#c0392b; font-weight:500; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

        .input-area {
            border-top:1px solid #dde4ec;
            padding:8px 12px 12px 12px;
            background:white;
            display:flex;
            gap:8px;
            flex-shrink:0;
            align-items:flex-end;
        }
        .input-area textarea {

            color:white;

        @media (max-width:600px) {

        .chat-container::-webkit-scrollbar { width:3px; }
        .chat-container::-webkit-scrollbar-track { background:#eef2f7; }

    <script>
        document.getElementById('copySourceBtn').addEventListener('click', function() {
            const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            navigator.clipboard.writeText(html).then(function() {
                const btn = document.getElementById('copySourceBtn');
                btn.textContent = ' Copied!';
                btn.classList.add('copied');
                setTimeout(function() {
                    btn.textContent = ' Copy Source';
                    btn.classList.remove('copied');
                }, 2000);
            });
        });

        function isMatrix(arr) {
            if (!Array.isArray(arr) || arr.length === 0) return false;
            for (let i = 0; i < arr.length; i++) {
                if (!Array.isArray(arr[i])) return false;
                if (i > 0 && arr[i].length !== arr[0].length) return false;
            }
            return true;
        }

        function cloneMatrix(m) { return m.map(row => [...row]); }

        function cleanZeros(M) {
            return M.map(row => row.map(v => Math.abs(v) < 1e-10 ? 0 : Number(v.toFixed(6))));
        }

        function matrixAdd(A, B) {
            return A.map((row, i) => row.map((val, j) => val + B[i][j]));
        }

        function matrixSub(A, B) {
            return A.map((row, i) => row.map((val, j) => val - B[i][j]));
        }

        function matrixMul(A, B) {
            const rA = A.length, cA = A[0].length, cB = B[0].length;
            const C = [];
            for (let i = 0; i < rA; i++) {
                C[i] = [];
                for (let j = 0; j < cB; j++) {
                    let sum = 0;
                    for (let k = 0; k < cA; k++) sum += A[i][k] * B[k][j];
                    C[i][j] = sum;
                }
            }
            return cleanZeros(C);
        }

        function matrixScalarMul(A, k) { return cleanZeros(A.map(row => row.map(x => x * k))); }

        function matrixTranspose(A) {
            return A[0].map((_, colIndex) => A.map(row => row[colIndex]));
        }

        function determinant(A) {
            const n = A.length;
            if (n === 1) return A[0][0];
            if (n === 2) return A[0][0]*A[1][1] - A[0][1]*A[1][0];
            let det = 0;
            for (let j = 0; j < n; j++) {
                const sub = A.slice(1).map(row => row.filter((_, idx) => idx !== j));
                det += (j % 2 === 0 ? 1 : -1) * A[0][j] * determinant(sub);
            }
            return Math.abs(det) < 1e-10 ? 0 : det;
        }

        function cofactorMatrix(A) {
            const n = A.length;
            const C = [];
            for (let i = 0; i < n; i++) {
                C[i] = [];
                for (let j = 0; j < n; j++) {
                    const sub = A.filter((_, idx) => idx !== i).map(row => row.filter((_, jdx) => jdx !== j));
                    C[i][j] = ((i + j) % 2 === 0 ? 1 : -1) * determinant(sub);
                }
            }
            return C;
        }

        function matrixAdjoint(A) {
            return cleanZeros(matrixTranspose(cofactorMatrix(A)));
        }

        function matrixInverse(A) {
            const det = determinant(A);
            if (Math.abs(det) < 1e-10) throw new Error('Matriks singular (det = 0), tidak memiliki invers.');
            return matrixScalarMul(matrixAdjoint(A), 1/det);
        }

        function rowEchelonForm(A) {
            let M = cloneMatrix(A);
            const rows = M.length, cols = M[0].length;
            let pivotRow = 0;

            for (let col = 0; col < cols && pivotRow < rows; col++) {
                let maxRow = pivotRow;
                for (let i = pivotRow + 1; i < rows; i++) {
                    if (Math.abs(M[i][col]) > Math.abs(M[maxRow][col])) maxRow = i;
                }

                if (Math.abs(M[maxRow][col]) < 1e-10) continue;

                [M[pivotRow], M[maxRow]] = [M[maxRow], M[pivotRow]];

                const pivotVal = M[pivotRow][col];
                for (let j = col; j < cols; j++) M[pivotRow][j] /= pivotVal;

                for (let i = pivotRow + 1; i < rows; i++) {
                    const factor = M[i][col];
                    for (let j = col; j < cols; j++) M[i][j] -= factor * M[pivotRow][j];
                }
                pivotRow++;
            }
            return cleanZeros(M);
        }

        function reducedRowEchelonForm(A) {
            let M = rowEchelonForm(A);
            const rows = M.length, cols = M[0].length;

            for (let r = rows - 1; r >= 0; r--) {
                let leadCol = -1;
                for (let c = 0; c < cols; c++) {
                    if (Math.abs(M[r][c] - 1) < 1e-10) {
                        leadCol = c;
                        break;
                    }
                }

                if (leadCol !== -1) {
                    for (let i = r - 1; i >= 0; i--) {
                        const factor = M[i][leadCol];
                        for (let j = leadCol; j < cols; j++) M[i][j] -= factor * M[r][j];
                    }
                }
            }
            return cleanZeros(M);
        }

        function matrixRank(A) {
            const rref = reducedRowEchelonForm(A);
            let rank = 0;
            for (let r = 0; r < rref.length; r++) {
                if (rref[r].some(val => Math.abs(val) > 1e-10)) rank++;
            }
            return rank;
        }

        function normalForm(A) {
            const r = matrixRank(A);
            const rows = A.length, cols = A[0].length;
            let N = [];
            for (let i = 0; i < rows; i++) {
                N[i] = [];
                for (let j = 0; j < cols; j++) {
                    N[i][j] = (i < r && j < r && i === j) ? 1 : 0;
                }
            }
            return N;
        }

        function luDecomposition(A) {
            if (!isMatrix(A) || A.length !== A[0].length) {
                throw new Error('Dekomposisi LU membutuhkan matriks persegi (n x n).');
            }
            const n = A.length;
            let L = Array.from({length: n}, () => Array(n).fill(0));
            let U = Array.from({length: n}, () => Array(n).fill(0));

            for (let i = 0; i < n; i++) {
                for (let k = i; k < n; k++) {
                    let sum = 0;
                    for (let j = 0; j < i; j++) sum += (L[i][j] * U[j][k]);
                    U[i][k] = A[i][k] - sum;
                }

                for (let k = i; k < n; k++) {
                    if (i === k) L[i][i] = 1;
                    else {
                        let sum = 0;
                        for (let j = 0; j < i; j++) sum += (L[k][j] * U[j][i]);
                        if (Math.abs(U[i][i]) < 1e-10) {
                            throw new Error('Dekomposisi LU tanpa permutasi gagal karena pivot 0. Diperlukan pertukaran baris (PLU).');
                        }
                        L[k][i] = (A[k][i] - sum) / U[i][i];
                    }
                }
            }
            return { L: cleanZeros(L), U: cleanZeros(U), isLU: true };
        }

        function getSubsets(array) {
            const result = [[]];
            for (const value of array) {
                const length = result.length;
                for (let i = 0; i < length; i++) {
                    result.push([...result[i], value]);
                }
            }
            return result.filter(set => set.length > 0);
        }

        function generateAllSubmatrices(A) {
            const m = A.length;
            const n = A[0].length;
            const rowIndices = Array.from({length: m}, (_, i) => i);
            const colIndices = Array.from({length: n}, (_, i) => i);
            const rowSubsets = getSubsets(rowIndices);
            const colSubsets = getSubsets(colIndices);
            const submatrices = [];

            for (const rows of rowSubsets) {
                for (const cols of colSubsets) {
                    const sub = rows.map(r => cols.map(c => A[r][c]));
                    submatrices.push({
                        rows: rows.map(r => r + 1),
                        cols: cols.map(c => c + 1),
                        matrix: sub
                    });
                }
            }

            submatrices.sort((a, b) => {
                const sizeA = a.matrix.length * a.matrix[0].length;
                const sizeB = b.matrix.length * b.matrix[0].length;
                return sizeB - sizeA;
            });

            return {
                totalRows: m,
                totalCols: n,
                count: (Math.pow(2, m) - 1) * (Math.pow(2, n) - 1),
                list: submatrices
            };
        }

        function parseMatrixLiteral(str) {
            let clean = str.replace(/\s/g, '').replace(/["']/g, '');
            if (!clean.startsWith('[[') || !clean.endsWith(']')) {
                throw new Error('Format matriks harus [[a,b],[c,d]]');
            }
            let inner = clean.slice(1, -1);
            let rows = [];
            let current = '';
            let depth = 0;
            for (let i = 0; i < inner.length; i++) {
                const ch = inner[i];
                if (ch === '[') {
                    depth++;
                    if (depth > 1) current += ch;
                } else if (ch === ']') {
                    depth--;
                    if (depth === 0) { rows.push(current); current = ''; }
                    else current += ch;
                } else if (depth >= 1) { current += ch; }
            }
            const result = rows.map(r => r.split(',').filter(s => s.trim() !== '').map(s => {
                const num = parseFloat(s.trim());
                if (isNaN(num)) throw new Error('Bukan angka: "' + s + '"');
                return num;
            }));
            return result;
        }

        function tokenize(expr) {
            const tokens = [];
            let i = 0;
            while (i < expr.length) {
                const ch = expr[i];
                if (/\s/.test(ch)) { i++; continue; }
                if (['(', ')', '+', '-', '*'].includes(ch)) {
                    tokens.push({ type: 'operator', value: ch });
                    i++; continue;
                }
                if (ch === "'") {
                    tokens.push({ type: 'postfix', value: 'transpose' });
                    i++; continue;
                }
                if (/\d/.test(ch) || (ch === '-' && i+1 < expr.length && /\d/.test(expr[i+1]))) {
                    let num = '';
                    if (ch === '-') { num += '-'; i++; }
                    while (i < expr.length && /[\d.]/.test(expr[i])) { num += expr[i]; i++; }
                    tokens.push({ type: 'number', value: parseFloat(num) });
                    continue;
                }
                if (/[a-zA-Z_]/.test(ch)) {
                    let id = '';
                    while (i < expr.length && /[a-zA-Z0-9_]/.test(expr[i])) { id += expr[i]; i++; }
                    if (i < expr.length && expr[i] === '(') {
                        tokens.push({ type: 'function', value: id });
                        continue;
                    }
                    tokens.push({ type: 'identifier', value: id });
                    continue;
                }
                if (ch === '[') {
                    let matrixStr = '';
                    let bracketCount = 0;
                    while (i < expr.length) {
                        const c = expr[i];
                        matrixStr += c;
                        if (c === '[') bracketCount++;
                        else if (c === ']') bracketCount--;
                        i++;
                        if (bracketCount === 0) break;
                    }
                    tokens.push({ type: 'matrix_literal', value: matrixStr });
                    continue;
                }
                throw new Error('Karakter tidak dikenal: "' + ch + '"');
            }
            return tokens;
        }

        function shuntingYard(tokens) {
            const output = [], ops = [];
            const precedence = { '+': 1, '-': 1, '*': 2 };

            for (let i = 0; i < tokens.length; i++) {
                const tok = tokens[i];
                if (['number', 'matrix_literal', 'identifier'].includes(tok.type)) {
                    output.push(tok);
                    if (i+1 < tokens.length && tokens[i+1].type === 'postfix') {
                        output.push({ type: 'unary', value: tokens[i+1].value });
                        i++;
                    }
                } else if (tok.type === 'function') {
                    ops.push(tok);
                } else if (tok.type === 'operator' && tok.value === '(') {
                    ops.push(tok);
                } else if (tok.type === 'operator' && tok.value === ')') {
                    while (ops.length > 0 && !(ops[ops.length-1].type === 'operator' && ops[ops.length-1].value === '(')) {
                        output.push(ops.pop());
                    }
                    ops.pop();
                    if (ops.length > 0 && ops[ops.length-1].type === 'function') {
                        output.push(ops.pop());
                    }
                } else if (tok.type === 'operator') {
                    while (ops.length > 0 && ops[ops.length-1].type === 'operator' &&
                           ops[ops.length-1].value !== '(' &&
                           precedence[ops[ops.length-1].value] >= precedence[tok.value]) {
                        output.push(ops.pop());
                    }
                    ops.push(tok);
                }
            }
            while (ops.length > 0) output.push(ops.pop());
            return output;
        }

        function evaluateRPN(rpn, vars) {
            const stack = [];
            for (const item of rpn) {
                if (item.type === 'number') stack.push(item.value);
                else if (item.type === 'matrix_literal') stack.push(parseMatrixLiteral(item.value));
                else if (item.type === 'identifier') {
                    if (vars[item.value] === undefined) throw new Error('Variabel "' + item.value + '" belum ditentukan.');
                    stack.push(vars[item.value]);
                } else if (item.type === 'function' || item.type === 'unary') {
                    const operand = stack.pop();
                    const fn = item.value;
                    if (fn === 'transpose') stack.push(matrixTranspose(operand));
                    else if (fn === 'det') stack.push(determinant(operand));
                    else if (fn === 'inv') stack.push(matrixInverse(operand));
                    else if (fn === 'rank') stack.push(matrixRank(operand));
                    else if (fn === 'adj') stack.push(matrixAdjoint(operand));
                    else if (fn === 'ref') stack.push(rowEchelonForm(operand));
                    else if (fn === 'rref') stack.push(reducedRowEchelonForm(operand));
                    else if (fn === 'normal') stack.push(normalForm(operand));
                    else if (fn === 'submatriks') stack.push(generateAllSubmatrices(operand));
                    else if (fn === 'lu') stack.push(luDecomposition(operand));
                } else if (item.type === 'operator') {
                    const b = stack.pop(), a = stack.pop();
                    if (item.value === '+') stack.push(matrixAdd(a, b));
                    else if (item.value === '-') stack.push(matrixSub(a, b));
                    else if (item.value === '*') {
                        if (typeof a === 'number') stack.push(matrixScalarMul(b, a));
                        else if (typeof b === 'number') stack.push(matrixScalarMul(a, b));
                        else stack.push(matrixMul(a, b));
                    }
                }
            }
            return stack[0];
        }

        function parseAndEvaluate(expr, vars) {
            try {

        function findConcept(text) {
            const normalized = normalize(text);
            let sortedConcepts = [];
            conceptData.forEach(item => {
                item.keywords.forEach(kw => {
                    sortedConcepts.push({ keyword: kw, answer: item.answer });
                });
            });
            sortedConcepts.sort((a, b) => b.keyword.length - a.keyword.length);

            for (const item of sortedConcepts) {
                if (normalized.includes(normalize(item.keyword))) {
                    return item.answer;
                }
            }
            return null;
        }

                copyBtn.className = 'concept-copy-btn';
                copyBtn.textContent = ' Copy';
                copyBtn.onclick = function() {
                    navigator.clipboard.writeText(cardDiv.innerText).then(() => {
                        copyBtn.textContent = ' Copied!';
                        copyBtn.classList.add('copied');
                        setTimeout(() => {
                            copyBtn.textContent = ' Copy';
                            copyBtn.classList.remove('copied');
                        }, 1500);
                    });
                };
                cardDiv.appendChild(copyBtn);
                msgDiv.appendChild(cardDiv);
            } else if (isLatex) {
                const latexDiv = document.createElement('div');
                latexDiv.className = 'latex-block';
                latexDiv.innerHTML = text;
                msgDiv.appendChild(latexDiv);
            } else {
                msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            }
            if (isError) msgDiv.classList.add('error');
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (window.MathJax) {
                MathJax.typesetPromise([msgDiv]).catch(() => {});
            }
        }

        function botReply(text, isLatex = false, isError = false, hasCopy = false) {
            addMessage(text, 'bot', isLatex, isError, hasCopy);
        }

        function userReply(text) {
            addMessage(text, 'user', false, false);
        }

        function toLatex(value) {
            if (typeof value === 'number') return String(value);
            if (Array.isArray(value) && isMatrix(value)) {
                let latex = '\\begin{bmatrix}';
                for (let i = 0; i < value.length; i++) {
                    latex += value[i].join(' & ');
                    if (i < value.length - 1) latex += ' \\\\ ';
                }
                latex += '\\end{bmatrix}';
                return latex;
            }
            return String(value);
        }

        function renderSubmatrixResult(res) {
            let html = `<b>Analisis Submatriks Lengkap</b><br><br>`;
            html += `<b>Ukuran Matriks Asal:</b> ${res.totalRows} � ${res.totalCols}<br>`;
            html += `<b>Rumus Banyaknya Submatriks:</b> \\((2^m - 1)(2^n - 1) = (2^{${res.totalRows}} - 1)(2^{${res.totalCols}} - 1)\\)<br>`;
            html += `<b>Total Submatriks yang Mungkin:</b> <b style="color:#2b5a8a; font-size:16px;">${res.count}</b> submatriks.<br><br>`;
            html += `<b>Daftar Semua Submatriks:</b>`;
            
            html += `<div class="submatrix-list">`;
            res.list.forEach((item, idx) => {
                html += `<div class="submatrix-item">`;
                html += `<b>#${idx + 1}</b> (Baris [${item.rows.join(',')}], Kolom [${item.cols.join(',')}])<br>`;
                html += `\\[ ${toLatex(item.matrix)} \\]`;
                html += `</div>`;
            });
            html += `</div>`;
            
            return html;
        }

        function renderLUResult(luRes) {
            let html = `<b>Hasil Dekomposisi Matriks A = LU</b><br><br>`;
            html += `<b>1. Matriks Segitiga Bawah (L - Lower):</b><br>`;
            html += `\\[ L = ${toLatex(luRes.L)} \\]<br>`;
            html += `<b>2. Matriks Segitiga Atas (U - Upper):</b><br>`;
            html += `\\[ U = ${toLatex(luRes.U)} \\]<br>`;
            html += `<b>3. Verifikasi Perkalian (L � U):</b><br>`;
            const LU_prod = matrixMul(luRes.L, luRes.U);
            html += `\\[ L \\cdot U = ${toLatex(luRes.L)} ${toLatex(luRes.U)} = ${toLatex(LU_prod)} \\]`;
            return html;
        }

        function processUserInput(input) {
            const trimmed = input.trim();
            if (!trimmed) return;
            userReply(trimmed);

            if (/^(help|bantuan|\?)$/i.test(trimmed)) {
                botReply('<b>Panduan Perintah Chatbot Matriks:</b><br><br>' +
                         '<b>1. Menyimpan Matriks:</b><br><code>A = [[2,1],[8,7]]</code><br><br>' +
                         '<b>2. Operasi Perhitungan:</b><br>' +
                         '� <code>lu(A)</code> � Dekomposisi Matriks A = LU<br>' +
                         '� <code>submatriks(A)</code> � Analisis seluruh submatriks<br>' +
                         '� <code>det(A)</code>, <code>inv(A)</code>, <code>rank(A)</code>, <code>ref(A)</code>, <code>rref(A)</code>, <code>adj(A)</code>, <code>A\'</code><br><br>' +
                         '<b>3. Teori & Sifat Lengkap:</b><br>Ketik <code>dekomposisi lu</code>, <code>idempotent</code>, <code>simetri</code>, <code>simetri miring</code>, <code>hermitian</code>, <code>matriks partisi</code>, <code>sifat determinan</code>, <code>sifat invers</code>, dll.', false);
                return;
            }

            const match = trimmed.match(/^\s*([a-zA-Z_]\w*)\s*=\s*(.+)$/);
            if (match) {
                try {
                    const value = parseAndEvaluate(match[2].trim(), matrixVars);
                    matrixVars[match[1]] = value;
                    botReply('Matriks <b>' + match[1] + '</b> disimpan.<br>\\[ ' + toLatex(value) + ' \\]', true);
                } catch (e) {
                    botReply('Gagal: ' + e.message, false, true);
                }
                return;
            }

            let exprToEval = trimmed;
            if (/^(rank|ref|rref|det|inv|adj|normal|submatriks|lu)$/i.test(trimmed)) {
                if (matrixVars['A']) {
                    exprToEval = trimmed + '(A)';
                }
            }

            try {
                const result = parseAndEvaluate(exprToEval, matrixVars);
                if (typeof result === 'object' && result.isLU) {
                    botReply(renderLUResult(result), true, false, true);
                    return;
                } else if (typeof result === 'object' && result.count !== undefined) {
                    botReply(renderSubmatrixResult(result), true, false, true);
                    return;
                } else if (typeof result === 'object' && isMatrix(result)) {
                    botReply('Hasil:<br>\\[ ' + toLatex(result) + ' \\]', true);
                    return;
                } else if (typeof result === 'number') {
                    botReply('Hasil: <b>' + result + '</b>', false);
                    return;
                }
            } catch (e) {}

            const conceptAnswer = findConcept(trimmed);
            if (conceptAnswer) {
                botReply(conceptAnswer, true, false, true);
                return;
            }

            botReply('Perintah tidak dikenali. Ketik <b>help</b> untuk melihat panduan lengkap.', false, true);
        }

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (text) {
                processUserInput(text);
                userInput.value = '';
                userInput.style.height = 'auto';
            }
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        window.insertExample = function(text) {
            userInput.value = text;
            userInput.focus();
        };

        botReply('<b>Selamat datang di Chatbot Aljabar Matriks!</b><br><br>' +
                 'Fitur Baru & Konsep Lengkap dengan Contoh Soal:<br>' +
                 '� Perintah <code>lu(A)</code> untuk Dekomposisi Matriks $A = LU$.<br>' +
                 '� Contoh soal + pengerjaan lengkap untuk semua konsep (Aturan Cramer, Invers, LU, dll).<br>' +
                 '� Perintah <code>submatriks(A)</code> untuk analisis submatriks.<br><br>' +
                 'Ketik <b>help</b> untuk panduan lengkap.', false);
    </script>
</body>
</html>
